name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        # 3.10 is the oldest Python that still receives security fixes (3.9 reached end of life in October 2025).
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts

      - name: Run type checking
        run: python -m mypy

      - name: Check the generated code
        run: |
          python scripts/unasync.py --check
          python scripts/generate.py --check

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check the package
        run: |
          python -m twine check --strict dist/*
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python - <<'PY'
          import importlib.resources, lettermint
          assert (importlib.resources.files("lettermint") / "UPGRADE.md").is_file(), "UPGRADE.md is not in the wheel"
          assert (importlib.resources.files("lettermint") / "py.typed").is_file()
          print("lettermint", lettermint.__version__, repr(lettermint.Lettermint("lm_smoke")))
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7
