name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Get version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or 1.2.3, got '${RELEASE_TAG}'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      # pyproject.toml reads the version from src/lettermint/_version.py (hatch dynamic version).
      - name: Set the version from the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" src/lettermint/_version.py
          grep -qx "__version__ = \"${VERSION}\"" src/lettermint/_version.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build package
        run: python -m build

      - name: Check the built version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls dist/
          normalized=$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$VERSION")
          test -f "dist/lettermint-${normalized}-py3-none-any.whl"
          test -f "dist/lettermint-${normalized}.tar.gz"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
