[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lettermint"
dynamic = ["version"]
description = "Official Lettermint Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Bjarn Bronsveld", email = "bjarn@lettermint.co" }
]
keywords = ["lettermint", "email", "sdk", "api", "transactional email", "webhooks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AnyIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "anyio>=3.5",
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=3.5",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/lettermint/lettermint-python"
Documentation = "https://github.com/lettermint/lettermint-python#readme"
Repository = "https://github.com/lettermint/lettermint-python"
Issues = "https://github.com/lettermint/lettermint-python/issues"
Changelog = "https://github.com/lettermint/lettermint-python/blob/main/CHANGELOG.md"
Upgrade = "https://github.com/lettermint/lettermint-python/blob/main/UPGRADE.md"

[tool.hatch.version]
path = "src/lettermint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lettermint"]

[tool.hatch.build.targets.wheel.force-include]
"UPGRADE.md" = "lettermint/UPGRADE.md"

[tool.hatch.build.targets.sdist]
include = ["src/lettermint", "tests", "scripts", "README.md", "UPGRADE.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["src/lettermint", "tests", "scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Written by the SDK generator and by scripts/unasync.py; checked by their own tools.
extend-exclude = ["src/lettermint/_generated", "src/lettermint/_sync"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "A",      # flake8-builtins
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "A003",   # resource methods are named list, delete, ... like the API
]

[tool.ruff.lint.isort]
known-first-party = ["lettermint"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
